name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

# A superseded run on the same branch is wasted compute, but never cancel a
# push to the default branch — that result is the one people look up later.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # There is no ESLint here by design: tsc is the lint, run over sources and
      # tests separately because they compile under different configs.
      - run: npm run lint
      - run: npm run lint:tests

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Packaging is a real gate, not a formality: a missing icon or a broken
      # .vscodeignore only ever surfaces at `vsce package` time.
      - run: npm run package
      - name: check what would ship
        run: npx --no-install @vscode/vsce ls
      - run: npm run package:bridge
      - uses: actions/upload-artifact@v4
        with:
          name: struktek-vsix
          path: '*.vsix'
          retention-days: 14
