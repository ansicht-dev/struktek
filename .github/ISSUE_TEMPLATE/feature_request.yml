name: Feature request
description: Something Struktek should be able to do and cannot.
title: 'feature: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Struktek is meant to stay small, so the part that decides most requests
        is the first question below — what you were trying to get done. Say that
        even if you are sure about the feature.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task you were on when Struktek got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Struktek to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: >
        The workaround, however ugly. It says more about the shape of the
        feature than a specification usually does.
  - type: input
    id: version
    attributes:
      label: Struktek version
  - type: input
    id: editor
    attributes:
      label: Editor
  - type: input
    id: platform
    attributes:
      label: Platform
